<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Quintal do Mendes — Apaixonados por Comida Boa</title>
  <meta name="description" content="Quintal do Mendes: comida caseira com alma. Veja nosso cardápio, peça pelo WhatsApp ou visite-nos.">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Quintal do Mendes">
  <meta property="og:description" content="Comida caseira com alma. Veja o cardápio e peça pelo WhatsApp.">
  <meta property="og:image" content="carrossel/0.jpeg">
  <meta property="og:locale" content="pt_BR">

  <!-- Favicon -->
  <link rel="icon" href="logo.jpg" type="image/jpeg">

  <!-- Preload da 1ª imagem para LCP rápido -->
  <link rel="preload" as="image" href="carrossel/0.jpeg">

  <!-- Google Fonts: Cormorant Garamond, Dancing Script 600/700, Barlow Semi Condensed -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Cormorant+Garamond:wght@600;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================
       DESIGN TOKENS — paleta extraída da logo (vinho, dourado, creme)
       ========================================================== */
    :root {
      --wine:          #7B1A2C;
      --wine-deep:     #4A0F1A;
      --wine-glass:    rgba(30, 6, 10, 0.55);
      --gold:          #C8952E;
      --gold-light:    #E2AA3E;
      --gold-border:   rgba(200, 149, 46, 0.70);
      --gold-dim:      rgba(200, 149, 46, 0.35);
      --cream:         #FDF6EE;
      --cream-slogan:  #F5E9D3;
      --cream-70:      rgba(253, 246, 238, 0.70);
      --cream-50:      rgba(253, 246, 238, 0.50);

      --font-serif:    'Cormorant Garamond', 'Georgia', serif;
      --font-script:   'Dancing Script', cursive;
      --font-sans:     'Barlow Semi Condensed', 'Arial Narrow', sans-serif;

      --safe-top:      env(safe-area-inset-top, 0px);
      --safe-bottom:   env(safe-area-inset-bottom, 0px);
    }

    /* ==========================================================
       RESET
       ========================================================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font-sans);
      background: var(--wine-deep);
      color: var(--cream);
      overflow: hidden;
      height: 100svh;
      -webkit-tap-highlight-color: transparent;
    }
    a { color: inherit; text-decoration: none; }
    button { border: none; background: none; font: inherit; cursor: pointer; color: inherit; }
    img { display: block; max-width: 100%; }

    /* ==========================================================
       PAGE LAYOUT
       ========================================================== */
    .page {
      position: relative;
      width: 100%;
      height: 100svh;
      overflow: hidden;
    }

    /* ---------- FOTOS DE FUNDO (CARROSSEL) ---------- */
    .photos {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }
    .slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      filter: brightness(0.75);
      transition: opacity 1.8s ease;
      will-change: opacity, transform;
    }
    .slide.active {
      opacity: 1;
    }

    /* Ken Burns */
    @keyframes kb-1 {
      from { transform: scale(1.00); }
      to   { transform: scale(1.12) translate(-1.5%, -0.8%); }
    }
    @keyframes kb-2 {
      from { transform: scale(1.02) translate(-0.5%, 0); }
      to   { transform: scale(1.14) translate(1%, -1.2%); }
    }
    @keyframes kb-3 {
      from { transform: scale(1.00); }
      to   { transform: scale(1.10) translate(1.2%, 0.8%); }
    }
    @keyframes kb-4 {
      from { transform: scale(1.06) translate(0.5%, 0.5%); }
      to   { transform: scale(1.00) translate(-0.8%, -0.3%); }
    }

    /* ---------- OVERLAY DEGRADÊ / SCRIM CENTRALIZADO ---------- */
    .content {
      position: relative;
      z-index: 1;
      height: 100%;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* Scrim com vinheta suave para destacar o bloco central */
    .content::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at 50% 50%,
          rgba(40, 8, 14, 0.72) 0%,
          rgba(40, 8, 14, 0.84) 55%,
          rgba(22, 4, 7, 0.94) 100%
        );
    }

    /* Bloco único centralizado no meio da tela */
    .content-inner {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: calc(16px + var(--safe-top)) 20px calc(16px + var(--safe-bottom));
      text-align: center;
      gap: 0;
    }

    /* ---------- TEXTURA DE RUÍDO (DESKTOP) ---------- */
    .noise-layer {
      display: none;
    }

    /* ==========================================================
       HEADER — LOGO + TÍTULO + SLOGAN (AGRUPADOS E COLADOS NOS BOTÕES)
       ========================================================== */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      flex-shrink: 0;
      width: 100%;
    }

    /* Logo com drop-shadow e anel dourado */
    .logo-ring {
      width: clamp(96px, 16svh, 140px);
      height: clamp(96px, 16svh, 140px);
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      box-shadow: 0 6px 20px rgba(0,0,0,0.45);
      filter: drop-shadow(0 6px 20px rgba(0,0,0,0.45));
      margin-bottom: 8px;
      flex-shrink: 0;
    }
    .logo-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    /* Título: clamp(30px, 5.2svh, 44px) + text-shadow + Mendes #E8B84A */
    .title {
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: clamp(30px, 5.2svh, 44px);
      line-height: 1.1;
      color: var(--cream);
      letter-spacing: 0.01em;
      text-shadow: 0 2px 14px rgba(0,0,0,0.75), 0 1px 3px rgba(0,0,0,0.6);
      margin-bottom: 4px;
    }
    .title .brand-gold {
      color: #E8B84A;
      font-style: normal;
      font-weight: 700;
    }

    /* Slogan: clamp(20px, 3.4svh, 28px) + text-shadow + 20px de respiro para indicadores */
    .slogan {
      font-family: var(--font-script);
      font-size: clamp(20px, 3.4svh, 28px);
      font-weight: 600;
      color: var(--cream-slogan);
      line-height: 1.2;
      text-shadow: 0 2px 14px rgba(0,0,0,0.75), 0 1px 3px rgba(0,0,0,0.6);
      margin-bottom: 20px;
    }

    /* ==========================================================
       GRUPO INFERIOR (INDICADORES + BOTÕES)
       ========================================================== */
    .bottom-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    /* Indicadores: 16px de respiro para o primeiro botão */
    .indicators {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin-bottom: 16px;
      flex-shrink: 0;
    }
    .indicator {
      width: 18px;
      height: 3px;
      border-radius: 2px;
      background: rgba(253, 246, 238, 0.28);
      border: none;
      padding: 0;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: background 0.3s;
    }
    .indicator::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: var(--gold-light);
      border-radius: 2px;
    }
    .indicator.active::after {
      width: 100%;
      animation: fillProgress 6s linear forwards;
    }
    @keyframes fillProgress {
      from { width: 0%; }
      to   { width: 100%; }
    }

    /* ==========================================================
       BOTÕES — VIDRO ESCURO, BORDA DOURADA 70%, TEXTO CREME, ÍCONES VIVOS
       ========================================================== */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      flex-shrink: 0;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: clamp(52px, 7svh, 60px);
      padding: 12px 18px;
      border-radius: 14px;
      font-family: var(--font-sans);
      font-size: 0.90rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      text-decoration: none;
      transition: transform 0.2s cubic-bezier(0.16,1,0.3,1), box-shadow 0.2s;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .btn:active {
      transform: scale(0.97) translateY(1px);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.3);
    }

    .btn-icon {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }
    .btn-label { flex: 1; text-align: left; }
    .btn-chevron {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      opacity: 0.55;
    }

    /* 1. "Ver cardápio" — mantido preenchido em dourado, texto vinho */
    .btn-filled {
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: var(--wine-deep);
      border: 1px solid var(--gold);
      box-shadow: 0 4px 22px rgba(200,149,46,0.35);
    }
    .btn-filled .btn-icon { color: var(--wine-deep); }
    .btn-filled .btn-chevron { opacity: 0.65; color: var(--wine-deep); }

    /* 2, 3 e 4. Botões de vidro */
    .btn-glass {
      background: var(--wine-glass);
      backdrop-filter: blur(14px) saturate(1.2);
      -webkit-backdrop-filter: blur(14px) saturate(1.2);
      border: 1px solid var(--gold-border);
      color: var(--cream);
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }
    .btn-glass .btn-icon { color: var(--gold-light); }
    .btn-glass .btn-chevron { color: var(--gold-light); opacity: 0.5; }

    /* ==========================================================
       FOOTER
       ========================================================== */
    .site-footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      padding-top: 6px;
    }
    .copyright {
      font-size: 0.68rem;
      color: var(--cream-50);
      font-weight: 500;
      text-shadow: 0 1px 6px rgba(0,0,0,0.5);
    }

    /* ==========================================================
       TELAS BAIXAS (MAX-HEIGHT: 680px) — Redução de 10% e respiros pela metade
       ========================================================== */
    @media (max-width: 1023px) and (max-height: 680px) {
      .content-inner {
        padding-bottom: calc(8px + var(--safe-bottom));
      }
      .logo-ring {
        width: clamp(80px, 14svh, 110px);
        height: clamp(80px, 14svh, 110px);
        margin-bottom: 4px;
      }
      .title {
        font-size: clamp(24px, 4.5svh, 34px);
        margin-bottom: 2px;
      }
      .slogan {
        font-size: clamp(17px, 2.9svh, 22px);
        margin-bottom: 10px;
      }
      .indicators {
        margin-bottom: 8px;
      }
      .actions {
        gap: 6px;
      }
      .btn {
        min-height: clamp(44px, 6.2svh, 50px);
        padding: 9px 14px;
        font-size: 0.84rem;
      }
      .site-footer {
        padding-top: 3px;
      }
    }

    /* ==========================================================
       ENTRANCE ANIMATIONS — stagger 120ms
       ========================================================== */
    .anim {
      opacity: 0;
      transform: translateY(22px);
    }
    .anim.visible {
      animation: enterUp 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes enterUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      .anim { opacity: 1; transform: none; }
      .anim.visible { animation: none; }
      .slide {
        transition-duration: 0.01ms !important;
        animation: none !important;
        transform: none !important;
      }
      .indicator.active::after { animation: none !important; width: 100% !important; }
      .btn { transition-duration: 0.01ms !important; }
    }

    /* ==========================================================
       DESKTOP (≥ 1024px) — Fullscreen Hero + Left Aligned Panel
       ========================================================== */
    .carousel-counter {
      display: none;
    }
    .desktop-arrows {
      display: none;
    }

    @media (min-width: 1024px) {
      body {
        overflow: hidden;
        height: 100vh;
        height: 100svh;
      }

      .page {
        position: relative;
        width: 100vw;
        height: 100vh;
        height: 100svh;
        overflow: hidden;
        display: block;
      }

      /* 1. Fundo: Fotos em tela cheia com Ken Burns */
      .photos {
        position: absolute;
        inset: -20px; /* margem extra para parallax de 12px */
        width: calc(100% + 40px);
        height: calc(100% + 40px);
        z-index: 0;
        will-change: transform;
      }
      .slide {
        object-fit: cover;
        object-position: center 40%;
      }

      /* 2. Overlay: degradê horizontal da esquerda para a direita + vinheta vertical suave */
      .content {
        position: absolute;
        inset: 0;
        z-index: 1;
        background: none;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .content::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background:
          /* Degradê horizontal suave com múltiplos color stops */
          linear-gradient(
            to right,
            rgba(58, 11, 20, 0.94) 0%,
            rgba(58, 11, 20, 0.92) 18%,
            rgba(58, 11, 20, 0.86) 30%,
            rgba(58, 11, 20, 0.72) 40%,
            rgba(58, 11, 20, 0.50) 48%,
            rgba(58, 11, 20, 0.25) 54%,
            rgba(58, 11, 20, 0.08) 60%,
            rgba(58, 11, 20, 0.00) 68%
          ),
          /* Vinheta escura sutil no topo e na base */
          linear-gradient(
            to bottom,
            rgba(25, 4, 8, 0.45) 0%,
            transparent 16%,
            transparent 84%,
            rgba(25, 4, 8, 0.55) 100%
          );
      }

      /* 3. Bloco de conteúdo alinhado à esquerda e centralizado verticalmente */
      .content-inner {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 460px;
        height: auto;
        max-height: 94vh;
        margin: 0;
        margin-left: 8vw;
        padding: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        text-align: left;
        gap: 20px;
      }

      /* Header: alinhado à esquerda */
      .header {
        align-items: flex-start;
        text-align: left;
        gap: 12px;
      }
      .logo-ring {
        width: 140px;
        height: 140px;
        padding: 4px;
      }
      .title {
        font-size: clamp(2.75rem, 3.8vw, 4rem);
        line-height: 1.05;
        text-align: left;
        text-shadow: 0 4px 20px rgba(0,0,0,0.7);
      }
      .slogan {
        font-size: clamp(1.75rem, 2.1vw, 2.1rem);
        white-space: nowrap;
        text-align: left;
      }

      /* Botões: 100% largura, 60px altura, hover com brilho dourado */
      .bottom-group {
        width: 100%;
        align-items: flex-start;
      }
      .actions {
        width: 100%;
        gap: 10px;
      }
      .btn {
        min-height: 60px;
        padding: 15px 22px;
        font-size: 0.95rem;
        border-radius: 14px;
        transition: transform 0.22s cubic-bezier(0.16,1,0.3,1), box-shadow 0.22s, border-color 0.22s;
      }
      .btn:hover {
        transform: translateY(-2px) scale(1.01);
        border-color: var(--gold-light);
        box-shadow: 0 8px 24px rgba(200,149,46,0.22), 0 0 16px rgba(200,149,46,0.30);
      }
      .btn-filled:hover {
        box-shadow: 0 8px 28px rgba(200,149,46,0.45), 0 0 18px rgba(200,149,46,0.40);
      }

      /* 4. Oculta barra de progresso e contador no desktop */
      .indicators-wrap,
      .indicators,
      .carousel-counter {
        display: none !important;
      }

      /* 5. Setas de navegação em círculos de vidro na lateral direita */
      .desktop-arrows {
        display: flex;
        position: absolute;
        right: 2.5vw;
        top: 50%;
        transform: translateY(-50%);
        flex-direction: column;
        gap: 14px;
        z-index: 2;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.35s ease, transform 0.35s ease;
      }
      .page:hover .desktop-arrows {
        opacity: 1;
        pointer-events: auto;
      }
      .arrow-btn {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: rgba(30, 6, 10, 0.65);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid var(--gold-border);
        color: var(--gold-light);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 0.2s, transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      }
      .arrow-btn:hover {
        background: rgba(200, 149, 46, 0.3);
        border-color: var(--gold-light);
        transform: scale(1.10);
        box-shadow: 0 0 16px rgba(200,149,46,0.35);
      }
      .arrow-btn svg {
        width: 22px;
        height: 22px;
      }

      /* 6. Rodapé alinhado ao bloco de conteúdo, sem sobreposição */
      .site-footer {
        position: static;
        align-items: flex-start;
        padding-top: 6px;
        margin-top: 4px;
        z-index: 2;
      }
      .copyright {
        font-size: 0.72rem;
        color: var(--cream-70);
      }

      /* Entrada em sequência da esquerda para a direita */
      .anim {
        opacity: 0;
        transform: translateX(-26px);
      }
      .anim.visible {
        animation: enterLeft 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes enterLeft {
        to { opacity: 1; transform: translateX(0); }
      }
    }
  </style>
</head>
<body>

  <main class="page" id="page">

    <!-- ===== PAINEL DE CONTEÚDO (mobile: overlay | desktop: lado esquerdo) ===== -->
    <div class="content">

      <!-- Textura de ruído SVG — apenas desktop -->
      <svg class="noise-layer" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <filter id="noiseFilter">
          <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="4" stitchTiles="stitch"/>
          <feColorMatrix type="saturate" values="0"/>
        </filter>
        <rect width="100%" height="100%" filter="url(#noiseFilter)"/>
      </svg>

      <div class="content-inner">

        <!-- HEADER -->
        <header class="header">
          <div class="logo-ring anim" data-anim="0">
            <img src="logo.jpg" alt="Logo Quintal do Mendes" width="96" height="96">
          </div>
          <h1 class="title anim" data-anim="1">Quintal do <span class="brand-gold">Mendes</span></h1>
          <p class="slogan anim" data-anim="2">Apaixonados por comida boa</p>
        </header>

        <!-- GRUPO INFERIOR (INDICADORES + BOTÕES) -->
        <div class="bottom-group anim" data-anim="3">

          <!-- Indicadores traços na base do hero, 16px acima dos botões (no desktop: canto inferior direito com contador) -->
          <div class="indicators-wrap">
            <div class="indicators" id="indicators"></div>
            <span class="carousel-counter" id="carouselCounter">01 / 11</span>
          </div>

          <!-- BOTÕES DE AÇÃO -->
          <nav class="actions" aria-label="Links do restaurante">

            <!-- 1. Ver cardápio — principal preenchido em dourado -->
            <a class="btn btn-filled" id="btnCardapio" href="#" target="_blank" rel="noopener">
              <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 016.5 2H20v20H6.5a2.5 2.5 0 010-5H20"/><path d="M8 7h6"/><path d="M8 11h4"/></svg>
              <span class="btn-label">Ver Cardápio</span>
              <svg class="btn-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
            </a>

            <!-- 2. Pedir no WhatsApp — vidro escuro + borda dourada 70% + ícone dourado vivo -->
            <a class="btn btn-glass" id="btnWhatsapp" href="#" target="_blank" rel="noopener">

  <!-- =============================================================
       JAVASCRIPT — Configuração, Carrossel Ken Burns, Swipe, Animações
       ============================================================= -->
  <script>
    /* ==========================================================
       CONFIGURAÇÃO — edite links e textos aqui
       ========================================================== */
    const CONFIG = {
      nome:    'Quintal do Mendes',
      slogan:  'Apaixonados por comida boa',

      whatsapp:  'https://wa.me/5527996998008?text=Ol%C3%A1!%20Vim%20pelo%20Instagram%20e%20gostaria%20de%20fazer%20um%20pedido.',
      instagram: 'https://www.instagram.com/quintaldomendes',
      cardapio:  'cardapio.pdf',
      maps:      'https://share.google/WD6qXZ6FtQiwPgj8m',

      slideInterval: 6000,
      kbDuration:    10000,
    };

    /* ==========================================================
       APLICA LINKS
       ========================================================== */
    document.getElementById('btnWhatsapp').href  = CONFIG.whatsapp;
    document.getElementById('btnInstagram').href = CONFIG.instagram;
    document.getElementById('btnCardapio').href  = CONFIG.cardapio;
    document.getElementById('btnMaps').href      = CONFIG.maps;

    /* ==========================================================
       CARROSSEL — crossfade + Ken Burns + progresso nos indicadores
       ========================================================== */
    (function() {
      const slides         = document.querySelectorAll('.slide');
      const indicatorsBox  = document.getElementById('indicators');
      const counterEl      = document.getElementById('carouselCounter');
      const deskPrev       = document.getElementById('deskPrev');
      const deskNext       = document.getElementById('deskNext');
      const total          = slides.length;
      let current          = 0;
      let timer            = null;
      const kbNames        = ['kb-1','kb-2','kb-3','kb-4'];
      const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function updateCounter(index) {
        if (counterEl) {
          const pad = (n) => String(n).padStart(2, '0');
          counterEl.textContent = `${pad(index + 1)} / ${pad(total)}`;
        }
      }

      /* Cria traços indicadores */
      for (let i = 0; i < total; i++) {
        const bar = document.createElement('button');
        bar.className = 'indicator' + (i === 0 ? ' active' : '');
        bar.setAttribute('aria-label', 'Foto ' + (i + 1));
        bar.addEventListener('click', () => { goTo(i); restartAutoplay(); });
        indicatorsBox.appendChild(bar);
      }
      updateCounter(0);

      function applyKenBurns(slide, index) {
        if (prefersReduced) return;
        const name = kbNames[index % kbNames.length];
        slide.style.animation = name + ' ' + (CONFIG.kbDuration / 1000) + 's ease-out forwards';
      }

      function clearKenBurns(slide) {
        slide.style.animation = '';
      }

      function goTo(n) {
        const prevIndex = current;
        current = ((n % total) + total) % total;
        if (prevIndex === current) return;

        /* Crossfade fotos */
        slides[prevIndex].classList.remove('active');
        clearKenBurns(slides[prevIndex]);
        slides[current].classList.add('active');
        applyKenBurns(slides[current], current);

        /* Atualiza indicadores e reinicia animação de preenchimento */
        indicatorsBox.querySelectorAll('.indicator').forEach((bar, i) => {
          bar.classList.remove('active');
          if (i === current) {
            void bar.offsetWidth;
            bar.classList.add('active');
          }
        });

        /* Atualiza contador no desktop */
        updateCounter(current);
      }

      function next() { goTo(current + 1); }
      function prev() { goTo(current - 1); }

      function startAutoplay() {
        stopAutoplay();
        timer = setInterval(next, CONFIG.slideInterval);
      }
      function stopAutoplay() {
        if (timer) { clearInterval(timer); timer = null; }
      }
      function restartAutoplay() {
        startAutoplay();
      }

      /* Setas no desktop */
      if (deskPrev) deskPrev.addEventListener('click', (e) => { e.stopPropagation(); prev(); restartAutoplay(); });
      if (deskNext) deskNext.addEventListener('click', (e) => { e.stopPropagation(); next(); restartAutoplay(); });

      applyKenBurns(slides[0], 0);
      startAutoplay();

      document.addEventListener('visibilitychange', () => {
        document.hidden ? stopAutoplay() : startAutoplay();
      });

      /* Touch / Swipe */
      const page = document.getElementById('page');
      let touchStartX = 0;
      let touchStartY = 0;
      let swiping = false;

      page.addEventListener('touchstart', (e) => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        swiping = true;
      }, { passive: true });

      page.addEventListener('touchend', (e) => {
        if (!swiping) return;
        swiping = false;
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;

        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 45) {
          dx < 0 ? next() : prev();
          restartAutoplay();
        }
      });
    })();

    /* ==========================================================
       PARALLAX SUTIL NO MOUSE (DESKTOP APENAS, MÁX 12PX)
       ========================================================== */
    (function() {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const photos = document.getElementById('photos');
      let targetX = 0, targetY = 0, currentX = 0, currentY = 0;

      window.addEventListener('mousemove', (e) => {
        if (window.innerWidth < 1024) return;
        const nx = (e.clientX / window.innerWidth) - 0.5;
        const ny = (e.clientY / window.innerHeight) - 0.5;
        targetX = -nx * 12;
        targetY = -ny * 12;
      });

      function loop() {
        if (window.innerWidth >= 1024) {
          currentX += (targetX - currentX) * 0.08;
          currentY += (targetY - currentY) * 0.08;
          photos.style.transform = `translate3d(${currentX.toFixed(2)}px, ${currentY.toFixed(2)}px, 0)`;
        } else {
          photos.style.transform = '';
        }
        requestAnimationFrame(loop);
      }
      loop();
    })();

    /* ==========================================================
       ANIMAÇÃO DE ENTRADA — Stagger 120ms
       ========================================================== */
    (function() {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.querySelectorAll('.anim').forEach(el => el.classList.remove('anim'));
        return;
      }

      const elements = document.querySelectorAll('.anim');
      elements.forEach(el => {
        const order = parseInt(el.dataset.anim || '0', 10);
        el.style.animationDelay = (order * 120) + 'ms';
      });

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          elements.forEach(el => el.classList.add('visible'));
        });
      });
    })();
  </script>
